[power]
action = "shutdown"
when = "programs-finished"

[[program]]
name = "missing"
executor = "linux"
path = "/bin/not-installed"

[[program]]
name = "once"
executor = "linux"
path = "/bin/entry"
args = ["Once"]
env = { ARONA_TEST = "yes" }
restart = "on-failure"
