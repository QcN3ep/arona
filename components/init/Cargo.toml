# SPDX-License-Identifier: MPL-2.0

[package]
name = "arona-init"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
baremetal = ["runtime/program"]

[[bin]]
name = "init"
path = "src/main.rs"
required-features = ["baremetal"]
test = false
bench = false

[dependencies]
runtime = { package = "arona-runtime", path = "../runtime" }
devmgr = { package = "arona-devmgr", path = "../devmgr" }
logger = { package = "arona-logger", path = "../logger" }
fs = { package = "arona-fs", path = "../fs" }
linux = { package = "arona-linux", path = "../linux" }
