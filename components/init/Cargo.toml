[package]
name = "arona-init"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
baremetal = ["runtime/program"]

[[bin]]
name = "init"
path = "src/main.rs"
required-features = ["baremetal"]
test = false
bench = false

[dependencies]
runtime = { package = "arona-runtime", path = "../runtime" }
devmgr = { package = "arona-devmgr", path = "../devmgr" }
logger = { package = "arona-logger", path = "../logger" }
fs = { package = "arona-fs", path = "../fs" }
net = { package = "arona-net", path = "../net" }
linux = { package = "arona-linux", path = "../linux" }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
