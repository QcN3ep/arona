[package]
name = "arona-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
baremetal = ["runtime/program"]
host-tests = []

[lib]
name = "fs"
test = false
bench = false

[[bin]]
name = "fs"
path = "src/main.rs"
required-features = ["baremetal"]
test = false
bench = false

[dependencies]
runtime = { package = "arona-runtime", path = "../runtime" }
devmgr = { package = "arona-devmgr", path = "../devmgr" }

[[test]]
name = "ext4"
path = "tests/ext4/mod.rs"
harness = false
required-features = ["baremetal"]

[[test]]
name = "tmpfs"
path = "tests/tmpfs/mod.rs"
required-features = ["host-tests"]
