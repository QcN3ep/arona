# SPDX-License-Identifier: MPL-2.0 OR GPL-3.0-or-later

[workspace]
resolver = "3"
members = [
    "kernel",
    "arch",
    "kernel-tests",
    "kernel-tests/macros",
    "abi",
    "components/runtime",
    "components/init",
    "components/devmgr",
    "components/logger",
    "components/fs",
    "components/linux",
    "components/net/lwip",
    "components/net",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MPL-2.0 OR GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
too_many_lines = "warn"
undocumented_unsafe_blocks = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
