name: CI image

on:
  push:
    branches: [main]
    paths:
      - ".github/images/ci/**"
      - ".github/workflows/ci-image.yml"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/images/ci/Dockerfile
          push: true
          tags: ghcr.io/qcn3ep/arona-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
