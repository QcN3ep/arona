[package]
name = "arona-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kernel"

[[test]]
name = "hardware"
path = "tests/hardware/mod.rs"

[[test]]
name = "memory"
path = "tests/memory/mod.rs"

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
log = { version = "0.4.34", default-features = false }
spin = { version = "0.9.9", default-features = false, features = ["mutex", "once", "rwlock", "spin_mutex"] }
