# SPDX-License-Identifier: MPL-2.0

[package]
name = "arona-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "kernel"

[[test]]
name = "hardware"
path = "tests/hardware/mod.rs"

[[test]]
name = "memory"
path = "tests/memory/mod.rs"

[dependencies]
abi = { package = "arona-abi", path = "../abi" }
allocator-api2 = { version = "0.2.21", default-features = false, features = ["alloc"] }
arrayvec = { version = "0.7.6", default-features = false }
log = { version = "0.4.34", default-features = false }
spin = { version = "0.9.9", default-features = false, features = ["mutex", "once", "rwlock", "spin_mutex"] }
triomphe = { version = "0.1.17", default-features = false }
