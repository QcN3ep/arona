[book]
title = "The Arona Book"
description = "Arona usage, architecture, and development guide"
authors = ["The Arona Authors"]
language = "en"
src = "src"

[rust]
edition = "2024"

[build]
build-dir = "../target/book"
create-missing = false
extra-watch-dirs = ["../CONTRIBUTING.md"]

[output.html]
additional-css = ["mdbook-admonish.css"]
additional-js = ["pdf-print-guard.js"]
git-repository-url = "https://github.com/QcN3ep/arona"
edit-url-template = "https://github.com/QcN3ep/arona/edit/main/book/{path}"

[output.html.playground]
runnable = false

[output.html.print]
enable = true

[output.pdf]
theme = "light"
paper-width = 8.2677
paper-height = 11.6929
margin-top = 0.6
margin-bottom = 0.6
margin-left = 0.6
margin-right = 0.6
print-background = true
generate-document-outline = false

[output.pdf-outline]
command = "./export-pdf.py"
like-wkhtmltopdf = true

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
