# SPDX-License-Identifier: MPL-2.0

[book]
title = "The Arona Book"
description = "Arona 的使用、架构与开发指南"
authors = ["The Arona Authors"]
language = "zh-CN"
src = "src"

[build]
build-dir = "../target/book"
create-missing = false
extra-watch-dirs = ["../CONTRIBUTING.md"]

[output.html]
additional-css = ["mdbook-admonish.css"]

[output.html.playground]
runnable = false

[output.html.print]
enable = true

[output.pdf]
generate-document-outline = false

[output.pdf-outline]
like-wkhtmltopdf = true

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
