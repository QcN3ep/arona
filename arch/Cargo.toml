# SPDX-License-Identifier: MPL-2.0 OR GPL-3.0-or-later

[package]
name = "arona-arch"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
baremetal = []
embedded-initramfs = []
runtime-tests = ["baremetal"]

[lib]
name = "arch"
path = "src/lib.rs"

[[bin]]
name = "arch"
path = "src/main.rs"
required-features = ["baremetal"]
test = false
bench = false

[[test]]
name = "boot"
path = "tests/boot/mod.rs"

[[test]]
name = "paging"
path = "tests/paging.rs"
harness = false
required-features = ["baremetal"]

[[test]]
name = "allocator"
path = "tests/allocator.rs"
harness = false
required-features = ["baremetal"]

[[test]]
name = "trap"
path = "tests/trap.rs"
harness = false
required-features = ["baremetal"]

[[test]]
name = "execution"
path = "tests/execution.rs"
harness = false
required-features = ["baremetal"]

[[test]]
name = "timer"
path = "tests/timer.rs"
harness = false
required-features = ["baremetal"]

[[test]]
name = "interrupt"
path = "tests/interrupt.rs"
harness = false
required-features = ["baremetal"]

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
fdt = "0.2.0-alpha3"
kernel = { package = "arona-kernel", path = "../kernel" }
spin = { version = "0.9.9", default-features = false, features = ["mutex", "spin_mutex"] }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
uefi-raw = "0.14.0"

[dev-dependencies]
kernel-tests = { package = "arona-kernel-tests", path = "../kernel-tests" }
