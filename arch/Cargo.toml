# SPDX-License-Identifier: MPL-2.0

[package]
name = "arona-arch"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
baremetal = []

[lib]
name = "arch"
path = "src/lib.rs"

[[bin]]
name = "arch"
path = "src/main.rs"
required-features = ["baremetal"]
test = false
bench = false

[[test]]
name = "dtb"
path = "tests/boot/dtb/mod.rs"

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
fdt = "0.2.0-alpha3"
kernel = { package = "arona-kernel", path = "../kernel" }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
uefi-raw = "0.14.0"
